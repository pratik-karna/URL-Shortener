{% extends 'base.html' %}
{% block title %}QR Code - TrimLink{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;">
    <div class="card">
        <div class="card-header">📱 QR Code</div>
        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code for {{ short_url }}">
            <p style="margin-top:1rem; color:var(--text-light); font-size:0.85rem;">{{ short_url }}</p>
            <div style="margin-top:1rem; display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                <a href="data:image/png;base64,{{ qr_b64 }}" download="qr-{{ url_obj.short_code }}.png" class="btn btn-primary">⬇️ Download PNG</a>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">← Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
